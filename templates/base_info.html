<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MediPredict{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-blue: #2563eb;
        --brand-teal: #14b8a6;
        --page-bg: #f8fafc;
        --text-dark: #1e293b;
      }

      body {
        font-family: "Poppins", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 24%),
          radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.16), transparent 28%),
          var(--page-bg);
        color: var(--text-dark);
      }

      .hero-wrap {
        border: 0;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.98), rgba(20, 184, 166, 0.92));
        color: #fff;
        padding: 34px;
        box-shadow: 0 28px 55px rgba(37, 99, 235, 0.16);
        overflow: hidden;
        position: relative;
      }

      .hero-wrap::after {
        content: "";
        position: absolute;
        right: -30px;
        top: -30px;
        width: 180px;
        height: 180px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .hero-icon {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.12);
        font-size: 1.9rem;
        margin-bottom: 18px;
      }

      .hero-copy {
        max-width: 60ch;
        color: rgba(255, 255, 255, 0.86);
      }

      .content-card {
        border: 0;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      }

      .soft-card {
        border-radius: 22px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: linear-gradient(180deg, #ffffff, #f8fbff);
        height: 100%;
      }

      .mini-label {
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        padding: 10px 14px;
        font-weight: 600;
      }

      @media (max-width: 767.98px) {
        .hero-wrap,
        .content-card,
        .soft-card {
          border-radius: 20px;
        }

        .hero-wrap {
          padding: 24px;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow" style="background: linear-gradient(90deg, #2563eb, #14b8a6);">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-3" href="/">MediPredict</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link {% if active_page == 'about' %}active{% endif %}" href="/about">About</a></li>
            <li class="nav-item"><a class="nav-link {% if active_page == 'contact' %}active{% endif %}" href="/contact">Contact</a></li>
            <li class="nav-item"><a class="nav-link {% if active_page == 'developer' %}active{% endif %}" href="/developer">Developer</a></li>
            <li class="nav-item"><a class="nav-link {% if active_page == 'blog' %}active{% endif %}" href="/blog">Blog</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-md-5">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
